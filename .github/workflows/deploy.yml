name: Deploy to GitHub Pages

# main에 병합될 때만 배포한다. dev 개발 중에는 CI만 돈다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build for Pages
        run: npx vite build --mode pages
        env:
          # 저장소 Settings > Variables 의 KAKAO_MAP_KEY (JavaScript 키, 도메인 제한으로 보호됨)
          VITE_KAKAO_MAP_KEY: ${{ vars.KAKAO_MAP_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
