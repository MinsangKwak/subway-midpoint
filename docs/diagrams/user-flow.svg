<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="644" viewBox="0 0 1120 644" role="img"><title>user-flow</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#8b94a8"/></marker></defs><rect width="1120" height="644" fill="#f3f5f8"/><g font-family="Noto Sans KR, sans-serif"><text x="48" y="52" font-size="16" fill="#e6552a" font-weight="700">SUBWAY MIDPOINT / USER FLOW</text><text x="48" y="100" font-size="30" fill="#14213d" font-weight="700">출발역을 고르고, 각자의 이동 부담을 비교합니다.</text><rect x="48" y="145" width="488" height="170" rx="18" fill="white" stroke="#dfe4ec" stroke-width="2"/><rect x="48" y="163" width="5" height="30" rx="2" fill="#ff6a3d"/><text x="72" y="190" font-size="24" fill="#14213d" font-weight="700">01  출발역 선택</text><text x="72" y="229" font-size="19" fill="#4b5670" font-weight="400">서로 다른 역 2~6곳을 자동완성으로 선택</text><text x="72" y="259" font-size="19" fill="#4b5670" font-weight="400">키보드 조작 · 한글 조합 상태 처리</text><rect x="584" y="145" width="488" height="170" rx="18" fill="white" stroke="#dfe4ec" stroke-width="2"/><rect x="584" y="163" width="5" height="30" rx="2" fill="#ff6a3d"/><text x="608" y="190" font-size="24" fill="#14213d" font-weight="700">02  중간지점 계산</text><text x="608" y="229" font-size="19" fill="#4b5670" font-weight="400">최대 예상 시간 → 전체 시간 합계 → 역 이름순</text><text x="608" y="259" font-size="19" fill="#4b5670" font-weight="400">출발역 제외 · 상위 후보 3개 반환</text><rect x="584" y="380" width="488" height="170" rx="18" fill="white" stroke="#dfe4ec" stroke-width="2"/><rect x="584" y="398" width="5" height="30" rx="2" fill="#ff6a3d"/><text x="608" y="425" font-size="24" fill="#14213d" font-weight="700">03  후보 비교</text><text x="608" y="464" font-size="19" fill="#4b5670" font-weight="400">개인별 예상 시간 · 환승 횟수 확인</text><text x="608" y="494" font-size="19" fill="#4b5670" font-weight="400">후보를 바꾸면 결과 카드와 지도 경로 변경</text><rect x="48" y="380" width="488" height="170" rx="18" fill="white" stroke="#dfe4ec" stroke-width="2"/><rect x="48" y="398" width="5" height="30" rx="2" fill="#ff6a3d"/><text x="72" y="425" font-size="24" fill="#14213d" font-weight="700">04  결과·주소 공유</text><text x="72" y="464" font-size="19" fill="#4b5670" font-weight="400">Web Share API 또는 클립보드 사용</text><text x="72" y="494" font-size="19" fill="#4b5670" font-weight="400">역 이름·개인별 결과와 같은 조건으로 열리는 주소 전달</text><path d="M537 229 L581 229" fill="none" stroke="#8b94a8" stroke-width="3" marker-end="url(#arrow)"/><path d="M828 316 L828 377" fill="none" stroke="#8b94a8" stroke-width="3" marker-end="url(#arrow)"/><path d="M583 463 L539 463" fill="none" stroke="#8b94a8" stroke-width="3" marker-end="url(#arrow)"/><text x="48" y="604" font-size="19" fill="#4b5670" font-weight="400">예상 시간은 거리·환승 비용 기반입니다. 실제 시각표와 다를 수 있습니다.</text></g></svg>