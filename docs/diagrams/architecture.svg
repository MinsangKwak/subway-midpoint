<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="886" viewBox="0 0 1120 886" role="img"><title>architecture</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#8b94a8"/></marker></defs><rect width="1120" height="886" fill="#f3f5f8"/><g font-family="Noto Sans KR, sans-serif"><text x="48" y="52" font-size="16" fill="#e6552a" font-weight="700">SUBWAY MIDPOINT / ARCHITECTURE</text><text x="48" y="100" font-size="29" fill="#14213d" font-weight="700">데이터는 미리 만들고, 계산은 브라우저에서 합니다.</text><text x="48" y="151" font-size="18" fill="#4b5670" font-weight="700">개발 단계</text><rect x="48" y="172" width="488" height="152" rx="18" fill="white" stroke="#dfe4ec" stroke-width="2"/><rect x="48" y="190" width="5" height="30" rx="2" fill="#ff6a3d"/><text x="72" y="217" font-size="24" fill="#14213d" font-weight="700">OSM · Overpass API</text><text x="72" y="256" font-size="19" fill="#4b5670" font-weight="400">13개 노선 원본 관계 수집 (광역 4개 포함)</text><text x="72" y="286" font-size="19" fill="#4b5670" font-weight="400">Node.js 스크립트로 정제·별칭·구간 생성</text><rect x="584" y="172" width="488" height="152" rx="18" fill="white" stroke="#dfe4ec" stroke-width="2"/><rect x="584" y="190" width="5" height="30" rx="2" fill="#ff6a3d"/><text x="608" y="217" font-size="24" fill="#14213d" font-weight="700">data/subway</text><text x="608" y="256" font-size="19" fill="#4b5670" font-weight="400">역 · 노선 · 운행 구간을 앱에 포함</text><text x="608" y="286" font-size="19" fill="#4b5670" font-weight="400">검색·계산마다 외부 API를 호출하지 않음</text><path d="M538 247 L580 247" fill="none" stroke="#8b94a8" stroke-width="3" marker-end="url(#arrow)"/><text x="48" y="374" font-size="18" fill="#4b5670" font-weight="700">브라우저 실행</text><rect x="48" y="395" width="488" height="170" rx="18" fill="white" stroke="#dfe4ec" stroke-width="2"/><rect x="48" y="413" width="5" height="30" rx="2" fill="#ff6a3d"/><text x="72" y="440" font-size="24" fill="#14213d" font-weight="700">planner → domain/subway</text><text x="72" y="479" font-size="19" fill="#4b5670" font-weight="400">출발역 선택 → 다중 출발점 다익스트라</text><text x="72" y="509" font-size="19" fill="#4b5670" font-weight="400">후보 정렬 · 경로 복원 → 추천 결과</text><rect x="584" y="395" width="488" height="170" rx="18" fill="white" stroke="#dfe4ec" stroke-width="2"/><rect x="584" y="413" width="5" height="30" rx="2" fill="#ff6a3d"/><text x="608" y="440" font-size="24" fill="#14213d" font-weight="700">app/App.tsx</text><text x="608" y="479" font-size="19" fill="#4b5670" font-weight="400">계산 상태와 선택 후보를 화면에 연결</text><text x="608" y="509" font-size="19" fill="#4b5670" font-weight="400">지도용 마커·경로·중간역 props 구성</text><path d="M538 480 L580 480" fill="none" stroke="#8b94a8" stroke-width="3" marker-end="url(#arrow)"/><path d="M828 325 L828 352 L292 352 L292 392" fill="none" stroke="#8b94a8" stroke-width="3" marker-end="url(#arrow)"/><rect x="48" y="644" width="488" height="150" rx="18" fill="white" stroke="#dfe4ec" stroke-width="2"/><rect x="48" y="662" width="5" height="30" rx="2" fill="#2f6df6"/><text x="72" y="689" font-size="24" fill="#14213d" font-weight="700">결과 카드</text><text x="72" y="728" font-size="19" fill="#4b5670" font-weight="400">개인별 시간 · 환승 횟수 · 후보 · 공유</text><text x="72" y="758" font-size="19" fill="#4b5670" font-weight="400">지도 실패 시에도 검색·계산·카드 사용</text><rect x="584" y="644" width="488" height="150" rx="18" fill="white" stroke="#dfe4ec" stroke-width="2"/><rect x="584" y="662" width="5" height="30" rx="2" fill="#2f6df6"/><text x="608" y="689" font-size="24" fill="#14213d" font-weight="700">map → Kakao Maps SDK</text><text x="608" y="728" font-size="19" fill="#4b5670" font-weight="400">지도 마커와 경유역 좌표 연결선 표시</text><text x="608" y="758" font-size="19" fill="#4b5670" font-weight="400">로딩 · 준비 · 키 누락 · 오류 상태 분리</text><path d="M828 566 L828 641" fill="none" stroke="#8b94a8" stroke-width="3" marker-end="url(#arrow)"/><path d="M720 566 L720 603 L292 603 L292 641" fill="none" stroke="#8b94a8" stroke-width="3" marker-end="url(#arrow)"/><text x="48" y="843" font-size="19" fill="#4b5670" font-weight="400">지도는 시각화를 담당합니다. 계산 로직은 React와 지도 SDK에 의존하지 않습니다.</text></g></svg>